{% extends "base.html" %}
{% block content %}

<!-- ══ MÀN HÌNH 1: Chọn bé ══ -->
<div id="screen-1" class="student-screen">
  <h1>Hôm nay ai làm bài? 🌸</h1>
  <div class="student-cards">
    {% for key, t in themes.items() %}
    <button type="button" class="student-card card-{{ key }}"
            data-key="{{ key }}" data-name="{{ t.name }}"
            data-icon="{{ t.icon }}" data-grades="{{ t.grades }}">
      <span class="sc-icon">{{ t.icon }}</span>
      <span class="sc-name">{{ t.name }}</span>
      <span class="sc-grades">{{ t.grades }}</span>
    </button>
    {% endfor %}
  </div>
</div>

<!-- ══ MÀN HÌNH 2: Chọn nội dung ══ -->
<div id="screen-2" class="hidden">

  <!-- Thanh bé đã chọn -->
  <div class="student-bar" id="student-bar">
    <span id="sb-icon"></span>
    <strong id="sb-name"></strong>
    <span id="sb-grades"></span>
    <button type="button" class="btn-change" onclick="resetStudent()">✏️ Đổi bé</button>
  </div>

  <form method="POST" action="{{ url_for('start') }}" id="start-form" class="card">
    <input type="hidden" name="student_key" id="skey"    value="">
    <input type="hidden" name="lop"         id="lopIn"   value="">
    <input type="hidden" name="folder"      id="folderIn" value="">
    <input type="hidden" name="exam_no"     id="examNoIn" value="">
    <input type="hidden" name="duration"    id="durIn"   value="">
    <input type="hidden" name="n_questions" id="nqIn"    value="">

    <!-- Bước 1: Chọn lớp -->
    <div class="section-label">📚 Chọn lớp</div>
    <div class="tabs" id="lop-tabs"></div>

    <!-- Bước 2: Chọn đề -->
    <div id="folder-row" class="hidden">
      <div class="section-label">📝 Chọn đề</div>
      <div class="tabs" id="folder-tabs"></div>
    </div>

    <!-- Bước 3: Chọn số đề -->
    <div id="exam-row" class="hidden">
      <div class="section-label">📄 Chọn số đề</div>
      <div class="tabs exam-tabs" id="exam-tabs"></div>
    </div>

    <!-- Bước 4: Thời gian -->
    <div id="dur-row" class="hidden">
      <div class="section-label">⏰ Thời gian làm bài</div>
      <div class="tabs dur-tabs">
        <button type="button" class="tab dur-tab" data-dur="60" data-nq="20">60 phút<br><small>20 câu</small></button>
        <button type="button" class="tab dur-tab" data-dur="90" data-nq="30">90 phút<br><small>30 câu</small></button>
      </div>
    </div>

    <button type="submit" class="btn-big" id="btn-start" disabled>
      Chọn đủ thông tin để bắt đầu 🔒
    </button>
  </form>
</div>

<script>
const CONTENT_TREE        = {{ content_tree_json|safe }};
const FOLDER_EXAM_COUNTS  = {{ folder_exam_counts_json|safe }};
const COMPLETED           = {{ completed_json|safe }};
const FOLDER_CAPACITIES   = {{ folder_capacities_json|safe }};
const HSG_EXAM_NQ         = {{ hsg_exam_nq_json|safe }};
const HSG_EXAM_DURATIONS  = {{ hsg_exam_dur_json|safe }};
const THEME_CLASS = { bao_meo: 'theme-pink', minh_khanh: 'theme-purple', nhat_khoi: 'theme-blue' };

const screen1   = document.getElementById('screen-1');
const screen2   = document.getElementById('screen-2');
const skeyIn    = document.getElementById('skey');
const lopIn     = document.getElementById('lopIn');
const folderIn  = document.getElementById('folderIn');
const examNoIn  = document.getElementById('examNoIn');
const durIn     = document.getElementById('durIn');
const nqIn      = document.getElementById('nqIn');
const btnStart  = document.getElementById('btn-start');
const folderRow = document.getElementById('folder-row');
const examRow   = document.getElementById('exam-row');
const durRow    = document.getElementById('dur-row');

function validate() {
  const ok = skeyIn.value && lopIn.value && folderIn.value && examNoIn.value && durIn.value;
  btnStart.disabled = !ok;
  btnStart.textContent = ok ? 'Bắt đầu làm bài 🚀' : 'Chọn đủ thông tin để bắt đầu 🔒';
}

function buildLopTabs() {
  const container = document.getElementById('lop-tabs');
  container.innerHTML = '';
  CONTENT_TREE.forEach(item => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab lop-tab';
    btn.dataset.lop = item.key;
    btn.textContent = item.display;
    btn.addEventListener('click', () => {
      container.querySelectorAll('.lop-tab').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      lopIn.value = item.key;
      folderIn.value = ''; examNoIn.value = '';
      durIn.value = ''; nqIn.value = '';
      document.querySelectorAll('.dur-tab, .folder-tab, .exam-tab').forEach(x => x.classList.remove('active'));
      examRow.classList.add('hidden');
      durRow.classList.add('hidden');
      buildFolderTabs(item.folders);
      folderRow.classList.remove('hidden');
      validate();
    });
    container.appendChild(btn);
  });
}

function buildFolderTabs(folders) {
  const container = document.getElementById('folder-tabs');
  container.innerHTML = '';
  folders.forEach(f => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab folder-tab';
    btn.dataset.folder = f.key;
    btn.textContent = f.display;
    btn.addEventListener('click', () => {
      container.querySelectorAll('.folder-tab').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      folderIn.value = f.key;
      examNoIn.value = '';
      durIn.value = ''; nqIn.value = '';
      document.querySelectorAll('.dur-tab, .exam-tab').forEach(x => x.classList.remove('active'));
      durRow.classList.add('hidden');
      buildExamTabs(f.key);
      updateDurTabs(f.key);
      examRow.classList.remove('hidden');
      validate();
    });
    container.appendChild(btn);
    if (folders.length === 1) btn.click();
  });
}

function updateDurTabs(folderKey) {
  if (folderKey === 'de_hsg_toan_6') {
    durRow.classList.add('hidden');
    return;
  }
  durRow.classList.remove('hidden');
  const cap = FOLDER_CAPACITIES[folderKey] || 0;
  document.querySelectorAll('.dur-tab').forEach(t => {
    const nq = parseInt(t.dataset.nq);
    if (nq > cap) {
      t.classList.add('hidden');
      if (t.classList.contains('active')) {
        t.classList.remove('active');
        durIn.value = ''; nqIn.value = '';
      }
    } else {
      t.classList.remove('hidden');
    }
  });
}

function buildExamTabs(folderKey) {
  const count = FOLDER_EXAM_COUNTS[folderKey] || 0;
  const studentKey = skeyIn.value;
  const done = (COMPLETED[studentKey] && COMPLETED[studentKey][folderKey]) || [];
  const container = document.getElementById('exam-tabs');
  container.innerHTML = '';
  for (let i = 1; i <= count; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isDone = done.includes(i);
    btn.className = 'tab exam-tab ' + (isDone ? 'exam-done' : 'exam-todo');
    btn.dataset.no = i;
    btn.textContent = 'Đề ' + i;
    btn.addEventListener('click', () => {
      container.querySelectorAll('.exam-tab').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      examNoIn.value = i;
      if (folderKey === 'de_hsg_toan_6') {
        durIn.value = HSG_EXAM_DURATIONS[i] || 120;
        nqIn.value  = HSG_EXAM_NQ[i] || 0;
        durRow.classList.add('hidden');
      } else {
        durIn.value = ''; nqIn.value = '';
        document.querySelectorAll('.dur-tab').forEach(x => x.classList.remove('active'));
        durRow.classList.remove('hidden');
      }
      validate();
    });
    container.appendChild(btn);
  }
}

// Chọn bé
document.querySelectorAll('.student-card').forEach(card => {
  card.addEventListener('click', () => {
    const key = card.dataset.key;
    skeyIn.value = key;
    lopIn.value = ''; folderIn.value = ''; examNoIn.value = '';
    durIn.value = ''; nqIn.value = '';

    document.getElementById('sb-icon').textContent   = card.dataset.icon + ' ';
    document.getElementById('sb-name').textContent   = card.dataset.name;
    document.getElementById('sb-grades').textContent = ' — ' + card.dataset.grades;

    Object.values(THEME_CLASS).forEach(c => document.body.classList.remove(c));
    document.body.classList.add(THEME_CLASS[key] || 'theme-pink');
    document.getElementById('start-form').className = 'card student-bg-' + key;

    folderRow.classList.add('hidden');
    examRow.classList.add('hidden');
    durRow.classList.add('hidden');
    document.querySelectorAll('.lop-tab, .folder-tab, .exam-tab, .dur-tab').forEach(x => x.classList.remove('active'));

    buildLopTabs();
    screen1.classList.add('hidden');
    screen2.classList.remove('hidden');
    validate();
  });
});

// Đổi bé
function resetStudent() {
  skeyIn.value = ''; lopIn.value = ''; folderIn.value = ''; examNoIn.value = '';
  durIn.value = ''; nqIn.value = '';
  Object.values(THEME_CLASS).forEach(c => document.body.classList.remove(c));
  screen2.classList.add('hidden');
  screen1.classList.remove('hidden');
  validate();
}

// Chọn thời gian
document.querySelectorAll('.dur-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.dur-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    durIn.value = t.dataset.dur;
    nqIn.value  = t.dataset.nq;
    validate();
  });
});

validate();
</script>
{% endblock %}
